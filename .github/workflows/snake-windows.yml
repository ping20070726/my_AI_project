name: Snake Windows executable
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: snake-win11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name SnakeWin11 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: SnakeWin11-Windows-x64
          path: snake-win11/dist/SnakeWin11.exe
          if-no-files-found: error
