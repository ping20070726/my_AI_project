name: Tetris Windows executable
on:
  push:
    paths:
      - 'tetris-win11/**'
      - '.github/workflows/tetris-windows.yml'
  pull_request:
    paths:
      - 'tetris-win11/**'
      - '.github/workflows/tetris-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tetris-win11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name TetrisWin11 main.py
      - name: Verify executable starts
        shell: pwsh
        run: |
          $gameProcess = Start-Process -FilePath dist/TetrisWin11.exe -PassThru
          Start-Sleep -Seconds 8
          if ($gameProcess.HasExited) { throw "Game exited unexpectedly: $($gameProcess.ExitCode)" }
          Stop-Process -Id $gameProcess.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TetrisWin11-Windows-x64
          path: tetris-win11/dist/TetrisWin11.exe
          if-no-files-found: error
